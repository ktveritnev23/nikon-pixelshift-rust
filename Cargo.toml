[package]
name = "pixelshift"
version = "0.1.0"
edition = "2021"
description = "Nikon Pixel Shift merger for high-resolution linear output (DNG/TIFF)"
license = "MIT OR Apache-2.0"

[lib]
name = "pixelshift"
path = "src/lib.rs"

[[bin]]
name = "pixelshift"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
rayon = "1.12"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive", "cargo"] }
eframe = "0.37"
rfd = "0.17"

[build-dependencies]
cc = "1.10"
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = 0
